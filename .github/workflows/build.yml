name: Build

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Cartridge model simulations
        run: sim/run_all.sh

  synth:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Quartus compile
        run: |
          docker run --rm -v "${{ github.workspace }}:/build" -w /build/src/fpga \
            raetro/quartus:21.1 quartus_sh --flow compile ap_core

      - name: Worst paths
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/build" -w /build/src/fpga \
            raetro/quartus:21.1 quartus_sta -t ../../scripts/report_timing.tcl || true
          head -60 src/fpga/output_files/worst_paths.txt || true

      - name: Timing summary
        if: always()
        run: |
          grep -A12 "Slow 1100mV 85C Model Setup Summary" src/fpga/output_files/ap_core.sta.rpt || true
          grep -A6 "Fitter Status" src/fpga/output_files/ap_core.fit.summary || true

      - name: Require positive slack
        run: |
          python3 - <<'PY'
          import re, sys
          rpt = open("src/fpga/output_files/ap_core.sta.rpt").read()
          bad = [l for l in rpt.splitlines() if re.match(r"^; \S.*; -\d", l) and "Setup" not in l]
          sec = rpt.split("Setup Summary")
          worst = []
          for chunk in sec[1:]:
              for l in chunk.splitlines()[3:12]:
                  m = re.match(r"^; (.+?)\s+; (-?[\d.]+)\s+;", l)
                  if m: worst.append((m.group(1).strip(), float(m.group(2))))
          neg = [w for w in worst if w[1] < 0]
          print("setup slack:", worst)
          sys.exit(1 if neg else 0)
          PY

      - name: Package
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          zip=$(scripts/package.sh src/fpga/output_files/ap_core.rbf "$v" dist)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SaveSiphon
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quartus-reports
          path: src/fpga/output_files/*.rpt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" \
            --title "SaveSiphon $GITHUB_REF_NAME" --notes-file .github/release-notes.md
