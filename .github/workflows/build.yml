name: Build

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Cartridge model simulations
        run: sim/run_all.sh

  synth:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Quartus compile
        run: |
          docker run --rm -v "${{ github.workspace }}:/build" -w /build/src/fpga \
            raetro/quartus:21.1 quartus_sh --flow compile ap_core

      - name: Timing summary
        if: always()
        run: |
          grep -A12 "Slow 1100mV 85C Model Setup Summary" src/fpga/output_files/ap_core.sta.rpt || true
          grep -A6 "Fitter Status" src/fpga/output_files/ap_core.fit.summary || true

      - name: Package
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          zip=$(scripts/package.sh src/fpga/output_files/ap_core.rbf "$v" dist)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SaveSiphon
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quartus-reports
          path: src/fpga/output_files/*.rpt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" \
            --title "SaveSiphon $GITHUB_REF_NAME" --notes-file .github/release-notes.md
